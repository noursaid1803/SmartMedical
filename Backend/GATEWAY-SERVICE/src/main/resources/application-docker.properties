spring.application.name=GATEWAY-SERVICE
server.port=8088

# CORS Configuration - autoriser le frontend Angular
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200,http://frontend:80
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=*
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# ROUTES - Noms de conteneurs Docker
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[5].id=doctors-service
spring.cloud.gateway.routes[5].uri=http://auth-service:8081
spring.cloud.gateway.routes[5].predicates[0]=Path=/doctors, /doctors/**

spring.cloud.gateway.routes[6].id=profile-service
spring.cloud.gateway.routes[6].uri=http://auth-service:8081
spring.cloud.gateway.routes[6].predicates[0]=Path=/profile, /profile/**

spring.cloud.gateway.routes[12].id=appointments-service
spring.cloud.gateway.routes[12].uri=http://auth-service:8081
spring.cloud.gateway.routes[12].predicates[0]=Path=/appointments, /appointments/**

spring.cloud.gateway.routes[1].id=patient-register-service
spring.cloud.gateway.routes[1].uri=http://auth-service:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/patients/register

spring.cloud.gateway.routes[2].id=patient-verify-service
spring.cloud.gateway.routes[2].uri=http://auth-service:8081
spring.cloud.gateway.routes[2].predicates[0]=Path=/patients/verify

spring.cloud.gateway.routes[3].id=patient-change-password-service
spring.cloud.gateway.routes[3].uri=http://auth-service:8081
spring.cloud.gateway.routes[3].predicates[0]=Path=/patients/change-password

spring.cloud.gateway.routes[4].id=patient-service
spring.cloud.gateway.routes[4].uri=http://auth-service:8081
spring.cloud.gateway.routes[4].predicates[0]=Path=/patients, /patients/**

spring.cloud.gateway.routes[8].id=medical-service
spring.cloud.gateway.routes[8].uri=http://medical-service:8083
spring.cloud.gateway.routes[8].predicates[0]=Path=/medical, /medical/**

spring.cloud.gateway.routes[9].id=scan-service
spring.cloud.gateway.routes[9].uri=http://scan-service:8084
spring.cloud.gateway.routes[9].predicates[0]=Path=/scan, /scan/**

spring.cloud.gateway.routes[10].id=user-service
spring.cloud.gateway.routes[10].uri=http://user-service:8085
spring.cloud.gateway.routes[10].predicates[0]=Path=/users, /users/**

# SipDetect Alzheimer (7 points + Grad-CAM) — priorité sur /ai/**
spring.cloud.gateway.routes[11].id=sipdetect-alzheimer-service
spring.cloud.gateway.routes[11].uri=http://sipdetect-alzheimer-service:8087
spring.cloud.gateway.routes[11].predicates[0]=Path=/ai/alzheimer/**
spring.cloud.gateway.routes[11].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[11].order=0

# AI Analysis Service (générique)
spring.cloud.gateway.routes[7].id=ai-analysis-service
spring.cloud.gateway.routes[7].uri=http://ai-service:8086
spring.cloud.gateway.routes[7].predicates[0]=Path=/ai/**
spring.cloud.gateway.routes[7].filters[0]=StripPrefix=0
spring.cloud.gateway.routes[7].order=10
