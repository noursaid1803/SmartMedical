<aside class="sidebar" [class.collapsed]="collapsed">
  <!-- Brand Header -->
  <div class="sidebar-brand">
    <a routerLink="/admin/dashboard" class="brand-link">
      <div class="brand-icon">
        <i class="bi bi-heart-pulse-fill"></i>
      </div>
      <div class="brand-text" *ngIf="!collapsed">
        <span class="brand-title">SmartMedical</span>
      </div>
    </a>
  </div>
  
  <!-- Navigation -->
  <nav class="sidebar-nav">
    <!-- Main Section -->
    <div class="nav-section">
      <div class="nav-section-title" *ngIf="!collapsed">Menu Principal</div>
      <ul class="nav flex-column">
        <li class="nav-item" *ngFor="let item of menuItems">
          <a 
            class="nav-link" 
            [routerLink]="item.path"
            routerLinkActive="active"
            [title]="collapsed ? item.label : ''"
          >
            <i [class]="'bi ' + item.icon"></i>
            <span class="nav-text" *ngIf="!collapsed">{{ item.label }}</span>
            <span class="nav-badge" *ngIf="item.badge && !collapsed">{{ item.badge }}</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>
  
  <!-- User Info Footer -->
  <div class="sidebar-footer">
    <div class="sidebar-user" *ngIf="!collapsed && (authService.currentUser$ | async) as user">
      <div class="user-avatar">
        {{ user.firstName?.[0] }}{{ user.lastName?.[0] }}
      </div>
      <div class="user-info">
        <div class="user-name">{{ user.firstName }} {{ user.lastName }}</div>
        <div class="user-role">{{ (user.roles?.[0] | titlecase) === 'User' ? 'Administrateur' : (user.roles?.[0] | titlecase) || 'Administrateur' }}</div>
      </div>
      <div class="user-status" title="En ligne"></div>
    </div>
    
    <!-- Back to site button -->
    <a routerLink="/frontoffice" class="btn btn-outline-primary btn-sm w-100 mt-2" *ngIf="!collapsed">
      <i class="bi bi-box-arrow-left me-2"></i>
      Retour au site
    </a>
    
    <!-- Collapsed: just icon -->
    <a routerLink="/frontoffice" class="btn btn-outline-primary btn-sm" *ngIf="collapsed" title="Retour au site">
      <i class="bi bi-box-arrow-left"></i>
    </a>
  </div>
</aside>

<!-- Mobile Overlay -->
<div class="sidebar-overlay" [class.show]="mobileOpen" (click)="closeMobile()"></div>
