<div class="patients-page">
  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-1">Gestion des Patients</h2>
      <p class="text-muted mb-0">{{ filteredPatients.length }} patients</p>
    </div>
    <button class="btn btn-primary">
      <i class="bi bi-plus-lg me-2"></i>
      Nouveau patient
    </button>
  </div>

  <!-- Search & Filter -->
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input 
              type="text" 
              class="form-control" 
              placeholder="Rechercher un patient..."
              [(ngModel)]="searchTerm"
            />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Patients Table -->
  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Nom</th>
              <th>Email</th>
              <th>Téléphone</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="isLoading">
              <td colspan="5" class="text-center py-4">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Chargement...</span>
                </div>
              </td>
            </tr>
            
            <tr *ngFor="let patient of filteredPatients">
              <td>#{{ patient.id }}</td>
              <td>
                <div class="d-flex align-items-center">
                  <div class="avatar bg-primary-subtle text-primary rounded-circle me-2" style="width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-person"></i>
                  </div>
                  {{ patient.firstName }} {{ patient.lastName }}
                </div>
              </td>
              <td>{{ patient.email }}</td>
              <td>{{ patient.phone }}</td>
              <td>
                <button class="btn btn-sm btn-outline-primary me-1">
                  <i class="bi bi-eye"></i>
                </button>
                <button class="btn btn-sm btn-outline-secondary me-1">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" (click)="deletePatient(patient.id!)">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
            
            <tr *ngIf="!isLoading && filteredPatients.length === 0">
              <td colspan="5" class="text-center py-4 text-muted">
                Aucun patient trouvé
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
