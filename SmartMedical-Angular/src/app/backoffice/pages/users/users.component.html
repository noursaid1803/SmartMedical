<div class="users-page">
  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-1">Gestion des Utilisateurs</h2>
      <p class="text-muted mb-0">{{ users.length }} utilisateurs</p>
    </div>
    <button class="btn btn-primary">
      <i class="bi bi-plus-lg me-2"></i>
      Nouvel utilisateur
    </button>
  </div>

  <!-- Users Table -->
  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Nom</th>
              <th>Email</th>
              <th>Rôle</th>
              <th>Statut</th>
              <th>Dernière connexion</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users">
              <td>#{{ user.id }}</td>
              <td>
                <div class="d-flex align-items-center">
                  <div class="avatar rounded-circle me-2" style="width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;" [class.bg-warning-subtle]="user.role === 'ADMIN'" [class.bg-primary-subtle]="user.role === 'DOCTOR'" [class.bg-info-subtle]="user.role === 'PATIENT'">
                    <i class="bi" [class.bi-shield-fill]="user.role === 'ADMIN'" [class.bi-heart-pulse]="user.role === 'DOCTOR'" [class.bi-person]="user.role === 'PATIENT'" [class.text-warning]="user.role === 'ADMIN'" [class.text-primary]="user.role === 'DOCTOR'" [class.text-info]="user.role === 'PATIENT'"></i>
                  </div>
                  {{ user.name }}
                </div>
              </td>
              <td>{{ user.email }}</td>
              <td>
                <span class="badge" [class.bg-warning]="user.role === 'ADMIN'" [class.bg-primary]="user.role === 'DOCTOR'" [class.bg-info]="user.role === 'PATIENT'">
                  {{ user.role }}
                </span>
              </td>
              <td>
                <span class="badge" [class.bg-success]="user.status === 'actif'" [class.bg-secondary]="user.status === 'inactif'">
                  {{ user.status }}
                </span>
              </td>
              <td>{{ user.lastLogin }}</td>
              <td>
                <button class="btn btn-sm btn-outline-primary me-1">
                  <i class="bi bi-eye"></i>
                </button>
                <button class="btn btn-sm btn-outline-secondary me-1">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
