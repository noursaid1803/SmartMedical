<div class="appointments-page">
  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-1">Gestion des Rendez-vous</h2>
      <p class="text-muted mb-0">{{ appointments.length }} rendez-vous</p>
    </div>
    <button class="btn btn-primary">
      <i class="bi bi-plus-lg me-2"></i>
      Nouveau RDV
    </button>
  </div>

  <!-- Appointments Table -->
  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Patient</th>
              <th>Médecin</th>
              <th>Date</th>
              <th>Heure</th>
              <th>Type</th>
              <th>Statut</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let apt of appointments">
              <td>#{{ apt.id }}</td>
              <td>{{ apt.patient }}</td>
              <td>{{ apt.doctor }}</td>
              <td>{{ apt.date | date:'dd/MM/yyyy' }}</td>
              <td>{{ apt.time }}</td>
              <td>{{ apt.type }}</td>
              <td>
                <span class="badge" 
                  [class.bg-success]="apt.status === 'confirmé'" 
                  [class.bg-warning]="apt.status === 'en attente'"
                  [class.bg-danger]="apt.status === 'annulé'">
                  {{ apt.status }}
                </span>
              </td>
              <td>
                <button class="btn btn-sm btn-outline-primary me-1">
                  <i class="bi bi-eye"></i>
                </button>
                <button class="btn btn-sm btn-outline-secondary me-1">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
