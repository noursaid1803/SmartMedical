<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand" routerLink="/frontoffice">
      <i class="bi bi-heart-pulse-fill text-primary me-2"></i>
      <strong>SmartMedical</strong>
    </a>
    
    <button 
      class="navbar-toggler" 
      type="button" 
      (click)="toggleMenu()"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" [class.show]="isMenuOpen">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/frontoffice" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Accueil</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/frontoffice/services" routerLinkActive="active">Services</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/frontoffice/doctors" routerLinkActive="active">Médecins</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/frontoffice/about" routerLinkActive="active">À propos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/frontoffice/contact" routerLinkActive="active">Contact</a>
        </li>
      </ul>
      
      <div class="d-flex align-items-center gap-2">
        <ng-container *ngIf="authService.currentUser$ | async as user; else notLoggedIn">
          <div class="dropdown">
            <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle me-1"></i>
              {{ user.firstName }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <!-- Mon Interface - redirection selon le rôle -->
              <li *ngIf="authService.isDoctor()">
                <a class="dropdown-item" routerLink="/doctor">
                  <i class="bi bi-heart-pulse me-2"></i>Mon interface médecin
                </a>
              </li>
              <li *ngIf="authService.isAdmin()">
                <a class="dropdown-item" routerLink="/admin">
                  <i class="bi bi-shield-lock me-2"></i>Mon interface admin
                </a>
              </li>
              <li *ngIf="!authService.isDoctor() && !authService.isAdmin()">
                <a class="dropdown-item" routerLink="/">
                  <i class="bi bi-house me-2"></i>Mon espace
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" routerLink="/profile">
                <i class="bi bi-person me-2"></i>Mon profil
              </a></li>
              <li><a class="dropdown-item" routerLink="/frontoffice/appointments">
                <i class="bi bi-calendar-check me-2"></i>Mes rendez-vous
              </a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="#" (click)="logout(); $event.preventDefault()">
                <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
              </a></li>
            </ul>
          </div>
        </ng-container>
        
        <ng-template #notLoggedIn>
          <a class="btn btn-outline-primary" routerLink="/login">Connexion</a>
          <a class="btn btn-primary" routerLink="/frontoffice/appointment">
            <i class="bi bi-calendar-check me-1"></i>
            Prendre RDV
          </a>
        </ng-template>
      </div>
    </div>
  </div>
</nav>
