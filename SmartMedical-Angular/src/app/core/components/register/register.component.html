<div class="register-container">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow">
          <div class="card-body p-4">
            <h2 class="text-center mb-4">SmartMedical</h2>
            <h4 class="text-center mb-4 text-muted">Inscription</h4>
            
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="firstName" class="form-label">Prénom</label>
                  <input 
                    type="text" 
                    id="firstName" 
                    class="form-control" 
                    formControlName="firstName"
                    placeholder="Votre prénom"
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="lastName" class="form-label">Nom</label>
                  <input 
                    type="text" 
                    id="lastName" 
                    class="form-control" 
                    formControlName="lastName"
                    placeholder="Votre nom"
                  />
                </div>
              </div>
              
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input 
                  type="email" 
                  id="email" 
                  class="form-control" 
                  formControlName="email"
                  placeholder="votre@email.com"
                />
              </div>
              
              <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <input 
                  type="password" 
                  id="password" 
                  class="form-control" 
                  formControlName="password"
                  placeholder="Min. 6 caractères"
                />
              </div>
              
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
                <input 
                  type="password" 
                  id="confirmPassword" 
                  class="form-control" 
                  formControlName="confirmPassword"
                  placeholder="Confirmez votre mot de passe"
                />
                <div *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched" class="text-danger small">
                  Les mots de passe ne correspondent pas
                </div>
              </div>
              
              <div *ngIf="errorMessage" class="alert alert-danger">
                {{ errorMessage }}
              </div>
              
              <button 
                type="submit" 
                class="btn btn-primary w-100" 
                [disabled]="registerForm.invalid || isLoading"
              >
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                {{ isLoading ? 'Inscription...' : 'S\'inscrire' }}
              </button>
            </form>
            
            <div class="mt-3 text-center">
              <p class="mb-0">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
