<div class="forgot-password-container">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow">
          <div class="card-body p-4">
            <h2 class="text-center mb-4">SmartMedical</h2>
            <h4 class="text-center mb-4 text-muted">Mot de passe oublié</h4>

            <p class="text-muted text-center mb-4">
              Entrez votre adresse email pour recevoir un code de vérification.
            </p>

            <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  formControlName="email"
                  placeholder="votre@email.com"
                />
                <div *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched" class="text-danger small">
                  Email invalide
                </div>
              </div>

              <div *ngIf="errorMessage" class="alert alert-danger">
                {{ errorMessage }}
              </div>

              <div *ngIf="successMessage" class="alert alert-success">
                {{ successMessage }}
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100"
                [disabled]="forgotForm.invalid || isLoading"
              >
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                {{ isLoading ? 'Envoi...' : 'Envoyer le code' }}
              </button>
            </form>

            <div class="mt-3 text-center">
              <a routerLink="/login" class="text-muted">
                <i class="bi bi-arrow-left me-1"></i>Retour à la connexion
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
