<div class="verify-code-container">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow">
          <div class="card-body p-4">
            <h2 class="text-center mb-4">SmartMedical</h2>
            <h4 class="text-center mb-4 text-muted">Vérification du code</h4>

            <p class="text-muted text-center mb-2">
              Entrez le code de 6 chiffres envoyé à :
            </p>
            <p class="text-center fw-bold mb-4">{{ email }}</p>

            <div class="timer text-center mb-4">
              <i class="bi bi-clock me-2"></i>
              <span [class.text-danger]="countdown < 60">
                Expire dans : {{ getFormattedTime() }}
              </span>
            </div>

            <form [formGroup]="verifyForm" (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <label for="code" class="form-label">Code de vérification</label>
                <input
                  type="text"
                  id="code"
                  class="form-control text-center fs-4"
                  formControlName="code"
                  placeholder="000000"
                  maxlength="6"
                  inputmode="numeric"
                  pattern="[0-9]*"
                />
                <div *ngIf="verifyForm.get('code')?.invalid && verifyForm.get('code')?.touched" class="text-danger small">
                  Veuillez entrer un code de 6 chiffres
                </div>
              </div>

              <div *ngIf="errorMessage" class="alert alert-danger">
                {{ errorMessage }}
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100 mb-3"
                [disabled]="verifyForm.invalid || isLoading || countdown === 0"
              >
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                {{ isLoading ? 'Vérification...' : 'Vérifier le code' }}
              </button>

              <button
                type="button"
                class="btn btn-outline-secondary w-100"
                (click)="resendCode()"
                [disabled]="countdown > 25 * 60"
              >
                <i class="bi bi-arrow-repeat me-2"></i>Renvoyer le code
              </button>
            </form>

            <div class="mt-3 text-center">
              <a routerLink="/login" class="text-muted">
                <i class="bi bi-arrow-left me-1"></i>Retour à la connexion
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
