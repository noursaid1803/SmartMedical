<div class="login-container">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow">
          <div class="card-body p-4">
            <h2 class="text-center mb-4">SmartMedical</h2>
            <h4 class="text-center mb-4 text-muted">Connexion</h4>
            
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input 
                  type="email" 
                  id="email" 
                  class="form-control" 
                  formControlName="email"
                  placeholder="votre@email.com"
                />
                <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-danger small">
                  Email invalide
                </div>
              </div>
              
              <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <input 
                  type="password" 
                  id="password" 
                  class="form-control" 
                  formControlName="password"
                  placeholder="Votre mot de passe"
                />
                <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger small">
                  Mot de passe requis (min 6 caractères)
                </div>
              </div>
              
              <div *ngIf="errorMessage" class="alert alert-danger">
                {{ errorMessage }}
              </div>
              
              <button 
                type="submit" 
                class="btn btn-primary w-100" 
                [disabled]="loginForm.invalid || isLoading"
              >
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                {{ isLoading ? 'Connexion...' : 'Se connecter' }}
              </button>
            </form>
            
            <div class="mt-3 text-center">
              <p class="mb-0">Pas encore de compte ? <a routerLink="/register">S'inscrire</a></p>
            </div>
            
            <div class="mt-3 text-center">
              <a routerLink="/frontoffice" class="text-muted">Continuer sans connexion</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
