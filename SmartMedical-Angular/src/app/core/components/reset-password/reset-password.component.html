<div class="reset-password-container">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow">
          <div class="card-body p-4">
            <h2 class="text-center mb-4">SmartMedical</h2>
            <h4 class="text-center mb-4 text-muted">Nouveau mot de passe</h4>

            <p class="text-muted text-center mb-4">
              Créez un nouveau mot de passe pour votre compte.
            </p>

            <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
              <!-- New Password -->
              <div class="mb-3">
                <label for="password" class="form-label">Nouveau mot de passe</label>
                <div class="input-group">
                  <input
                    [type]="showPassword ? 'text' : 'password'"
                    id="password"
                    class="form-control"
                    formControlName="password"
                    placeholder="Votre nouveau mot de passe"
                  />
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    (click)="togglePasswordVisibility()"
                    [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
                  >
                    <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
                  </button>
                </div>
                <div *ngIf="resetForm.get('password')?.invalid && resetForm.get('password')?.touched" class="text-danger small">
                  Mot de passe requis (min 6 caractères)
                </div>
              </div>

              <!-- Confirm Password -->
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
                <div class="input-group">
                  <input
                    [type]="showConfirmPassword ? 'text' : 'password'"
                    id="confirmPassword"
                    class="form-control"
                    formControlName="confirmPassword"
                    placeholder="Confirmez votre mot de passe"
                  />
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    (click)="toggleConfirmPasswordVisibility()"
                    [attr.aria-label]="showConfirmPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
                  >
                    <i class="bi" [class.bi-eye]="!showConfirmPassword" [class.bi-eye-slash]="showConfirmPassword"></i>
                  </button>
                </div>
                <div *ngIf="resetForm.get('confirmPassword')?.hasError('mismatch') && resetForm.get('confirmPassword')?.touched" class="text-danger small">
                  Les mots de passe ne correspondent pas
                </div>
              </div>

              <div *ngIf="errorMessage" class="alert alert-danger">
                {{ errorMessage }}
              </div>

              <div *ngIf="successMessage" class="alert alert-success">
                {{ successMessage }}
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100"
                [disabled]="resetForm.invalid || isLoading"
              >
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                {{ isLoading ? 'Réinitialisation...' : 'Réinitialiser le mot de passe' }}
              </button>
            </form>

            <div class="mt-3 text-center">
              <a routerLink="/login" class="text-muted">
                <i class="bi bi-arrow-left me-1"></i>Retour à la connexion
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
