# ================================================================
# SmartMedical - Docker Compose
# Architecture microservices complète
# ================================================================
# Services :
#   - mongodb          : Base de données (port 27017)
#   - zookeeper        : Coordination Kafka (port 2181)
#   - kafka            : Message broker (port 9092)
#   - auth-service     : Authentification Spring Boot (port 8081)
#   - patient-service  : Gestion patients Spring Boot (port 8082)
#   - medical-service  : Service médical Spring Boot (port 8083)
#   - scan-service     : Service scans Spring Boot (port 8084)
#   - user-service     : Service utilisateurs Spring Boot (port 8085)
#   - ai-service       : Analyse IA FastAPI/Python (port 8086)
#   - gateway-service  : API Gateway Spring Cloud (port 8088)
#   - frontend         : Angular 19 / Nginx (port 4200)
# ================================================================

version: '3.9'

networks:
  smartmedical-network:
    external: true
    name: smartmedical-network

volumes:
  mongodb-data:
    name: smartmedical-mongodb-data
  ai-models:
    name: smartmedical-ai-models

services:

  # ============================================================
  # BASE DE DONNÉES - MongoDB
  # ============================================================
  mongodb:
    image: mongo:7.0
    container_name: smartmedical-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - smartmedical-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================================
  # KAFKA - Message Broker (utilisé par MEDICAL & SCAN services)
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: smartmedical-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - smartmedical-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: smartmedical-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - smartmedical-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  # AUTH-SERVICE - Spring Boot (port 8081)
  # Gère : authentification, JWT, médecins, profils, patients/register
  # ============================================================
  auth-service:
    build:
      context: ./Backend/AUTH-SERVICE
      dockerfile: Dockerfile
    container_name: smartmedical-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smartmedical-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ============================================================
  # PATIENT-SERVICE - Spring Boot (port 8082)
  # ============================================================
  patient-service:
    build:
      context: ./Backend/PATIENT-SERVICE
      dockerfile: Dockerfile
    container_name: smartmedical-patient
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smartmedical-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ============================================================
  # MEDICAL-SERVICE - Spring Boot (port 8083) - Utilise Kafka
  # ============================================================
  medical-service:
    build:
      context: ./Backend/MEDICAL-SERVICE
      dockerfile: Dockerfile
    container_name: smartmedical-medical
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smartmedical-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ============================================================
  # SCAN-SERVICE - Spring Boot (port 8084) - Utilise Kafka
  # ============================================================
  scan-service:
    build:
      context: ./Backend/SCAN-SERVICE
      dockerfile: Dockerfile
    container_name: smartmedical-scan
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - smartmedical-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ============================================================
  # USER-SERVICE - Spring Boot (port 8085)
  # ============================================================
  user-service:
    build:
      context: ./Backend/USER-SERVICE
      dockerfile: Dockerfile
    container_name: smartmedical-user
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smartmedical-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ============================================================
  # AI-ANALYSIS-SERVICE - FastAPI / Python (port 8086)
  # ============================================================
  ai-service:
    build:
      context: ./Backend/AI-ANALYSIS-SERVICE
      dockerfile: Dockerfile
    container_name: smartmedical-ai
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - ai-models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8086
      - MODEL_PATH=/app/models/weights/medical_organ_classifier.pth
    networks:
      - smartmedical-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/health 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================
  # SIPDETECT-ALZHEIMER-SERVICE - FastAPI / Python (port 8087)
  # Détection Alzheimer SipDetect v6 (CNN+GAT+PH)
  # ============================================================
  sipdetect-alzheimer-service:
    build:
      context: .
      dockerfile: Backend/SIPDETECT-ALZHEIMER-SERVICE/Dockerfile
    container_name: smartmedical-sipdetect-alzheimer
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      - PYTHONUNBUFFERED=1
      - SIPDETECT_MODEL_PATH=/app/models/model.pth
      - SIPDETECT_MODEL_DIR=/app/models
    networks:
      - smartmedical-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8087/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ============================================================
  # GATEWAY-SERVICE - Spring Cloud Gateway (port 8088)
  # Point d'entrée unique pour tous les microservices
  # ============================================================
  gateway-service:
    build:
      context: ./Backend/GATEWAY-SERVICE
      dockerfile: Dockerfile
    container_name: smartmedical-gateway
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      auth-service:
        condition: service_started
      patient-service:
        condition: service_started
      medical-service:
        condition: service_started
      scan-service:
        condition: service_started
      user-service:
        condition: service_started
      ai-service:
        condition: service_started
      sipdetect-alzheimer-service:
        condition: service_started
    networks:
      - smartmedical-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health 2>/dev/null || wget -qO- http://localhost:8088/ 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ============================================================
  # FRONTEND - Angular 19 / Nginx (port 4200)
  # ============================================================
  frontend:
    build:
      context: ./SmartMedical-Angular
      dockerfile: Dockerfile
    container_name: smartmedical-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - gateway-service
    networks:
      - smartmedical-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
